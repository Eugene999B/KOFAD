name: Verify free-only KOFAD AI
on:
  pull_request:
    paths:
      - "marketplace/kofad_ai.py"
      - "marketplace/kofad_ai_views.py"
      - "marketplace/test_kofad_ai.py"
      - "marketplace/static/marketplace/kofad-ai.*"
      - "marketplace/templates/marketplace/partials/kofad_ai_chat.html"
      - "marketplace/templates/marketplace/base.html"
      - "marketplace/urls.py"
      - "core/telegram_assistant.py"
      - "core/domain_middleware.py"
      - "config/settings.py"
      - ".github/workflows/kofad-free-ai.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  free-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kofad
          POSTGRES_PASSWORD: ai-ci-only
          POSTGRES_DB: kofad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kofad"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kofad:ai-ci-only@localhost:5432/kofad
      DJANGO_SECRET_KEY: temporary-ai-ci-secret-never-use-production
      DJANGO_DEBUG: "1"
      SECURE_SSL_REDIRECT: "0"
      OPENROUTER_API_KEY: ""
      KOFAD_OPENROUTER_FREE_ENABLED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt -c requirements.lock
      - run: ruff check marketplace/kofad_ai.py marketplace/kofad_ai_views.py marketplace/test_kofad_ai.py core/telegram_assistant.py core/domain_middleware.py
      - run: node --check marketplace/static/marketplace/kofad-ai.js
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test marketplace.test_kofad_ai core.test_telegram_quick --noinput
