name: Verify KOFAD Notifications

on:
  pull_request:
    paths:
      - "core/notification_engine.py"
      - "core/management/commands/process_sms.py"
      - "core/test_notification_and_payroll_portal.py"
      - "core/migrations/0046_verified_owner_email_reports.py"
      - "marketplace/test_customer_email_preferences.py"
      - ".github/workflows/verify-notifications.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: kofad
          POSTGRES_PASSWORD: testing-only
          POSTGRES_DB: kofad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kofad"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kofad:testing-only@localhost:5432/kofad
      DJANGO_SECRET_KEY: ci-only-nonproduction-key-at-least-32-characters
      DJANGO_DEBUG: "1"
      SECURE_SSL_REDIRECT: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt -c requirements.lock
      - run: ruff check core/notification_engine.py core/management/commands/process_sms.py core/test_notification_and_payroll_portal.py marketplace/test_customer_email_preferences.py
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test core.test_notification_and_payroll_portal marketplace.test_customer_email_preferences --noinput
