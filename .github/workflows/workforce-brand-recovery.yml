name: Verify KOFAD official workforce brand
on:
  pull_request:
    paths:
      - core/workforce_views.py
      - .github/workflows/workforce-brand-recovery.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-kofad-branding-secret-1234567890
      DJANGO_DEBUG: "1"
      SECURE_SSL_REDIRECT: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt -c requirements.lock
      - run: ruff check core/workforce_views.py
      - run: python scripts/prepare_logo.py
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test core.test_branding --noinput
