name: Verify native KOFAD PKCE identity
on:
  pull_request:
    paths:
      - "marketplace/mobile_identity.py"
      - "marketplace/mobile_auth_models.py"
      - "marketplace/test_mobile_identity.py"
      - "marketplace/models.py"
      - "marketplace/migrations/0025_native_mobile_identity.py"
      - "marketplace/urls.py"
      - "core/urls.py"
      - ".github/workflows/native-identity-fast.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-identity:
    name: Verify KOFAD mobile OAuth/PKCE and session security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: kofad
          POSTGRES_PASSWORD: testing-only
          POSTGRES_DB: kofad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kofad"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kofad:testing-only@localhost:5432/kofad
      DJANGO_SECRET_KEY: ci-only-nonproduction-key-at-least-32-characters
      DJANGO_DEBUG: "1"
      SECURE_SSL_REDIRECT: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af6772620 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt -c requirements.lock
      - name: Check mobile data models and deployment migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Run mobile API and security integration tests
        run: python manage.py test marketplace.test_mobile_identity marketplace.test_mobile_v1_api core.test_mobile_staff_api --noinput
