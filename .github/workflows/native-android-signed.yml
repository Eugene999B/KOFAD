name: Prepare signed KOFAD Android release (review only)
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Separate customer or staff signing identity
        required: true
        type: choice
        options: [customer, staff]
      version:
        description: "SemVer X.Y.Z; must exceed the installed version"
        required: true
        type: string
      version_code:
        description: "Unique increasing Android versionCode"
        required: true
        type: number

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: kofad-native-publishing
    env:
      KOFAD_NATIVE_CHANNEL: ${{ inputs.channel }}
      KOFAD_NATIVE_VERSION: ${{ inputs.version }}
      KOFAD_NATIVE_VERSION_CODE: ${{ inputs.version_code }}
      KOFAD_KEYSTORE_B64: ${{ inputs.channel == 'customer' && secrets.KOFAD_CUSTOMER_ANDROID_KEYSTORE_B64 || secrets.KOFAD_STAFF_ANDROID_KEYSTORE_B64 }}
      KOFAD_KEYSTORE_PASSWORD: ${{ inputs.channel == 'customer' && secrets.KOFAD_CUSTOMER_ANDROID_KEYSTORE_PASSWORD || secrets.KOFAD_STAFF_ANDROID_KEYSTORE_PASSWORD }}
      KOFAD_KEY_ALIAS: ${{ inputs.channel == 'customer' && secrets.KOFAD_CUSTOMER_ANDROID_KEY_ALIAS || secrets.KOFAD_STAFF_ANDROID_KEY_ALIAS }}
      KOFAD_KEY_PASSWORD: ${{ inputs.channel == 'customer' && secrets.KOFAD_CUSTOMER_ANDROID_KEY_PASSWORD || secrets.KOFAD_STAFF_ANDROID_KEY_PASSWORD }}
      KOFAD_CERT_SHA256: ${{ inputs.channel == 'customer' && secrets.KOFAD_CUSTOMER_ANDROID_CERT_SHA256 || secrets.KOFAD_STAFF_ANDROID_CERT_SHA256 }}
    steps:
      - name: Fail closed if publisher keys are missing
        shell: bash
        run: |
          set -euo pipefail
          for key in KOFAD_KEYSTORE_B64 KOFAD_KEYSTORE_PASSWORD KOFAD_KEY_ALIAS KOFAD_KEY_PASSWORD KOFAD_CERT_SHA256; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required protected signing secret: $key"
              exit 1
            fi
          done
          if [[ ! "$KOFAD_CERT_SHA256" =~ ^([[:xdigit:]]{2}:?){32}$ ]]; then
            echo "::error::Pinned Android signing certificate fingerprint is malformed"
            exit 1
          fi
          echo "Publisher signing prerequisites present (no secret values logged)."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Generate correct branded app assets and bundled app
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install Pillow
          python scripts/prepare_logo.py
          python native/scripts/branding.py --channel "$KOFAD_NATIVE_CHANNEL"
          cd native/mobile
          npm install --no-audit --no-fund
          npm test
          node scripts/write-profile.mjs
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android
      - name: Pin release version and compile unsigned artifact
        shell: bash
        run: |
          set -euo pipefail
          python native/scripts/set_android_version.py native/mobile/android/app/build.gradle "$KOFAD_NATIVE_VERSION" "$KOFAD_NATIVE_VERSION_CODE"
          if [[ "$KOFAD_NATIVE_CHANNEL" == "customer" ]]; then
            expected="com.kofadimpex.market"
          else
            expected="com.kofadimpex.staff"
          fi
          if ! grep -qF "applicationId \"$expected\"" native/mobile/android/app/build.gradle; then
            echo "::error::Android native package ID does not match the selected release channel"
            exit 1
          fi
          cd native/mobile/android
          ./gradlew assembleRelease --no-daemon
      - name: Sign and independently verify the Android APK
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cert="$RUNNER_TEMP/kofad-signing.jks"
          printf '%s' "$KOFAD_KEYSTORE_B64" | base64 --decode > "$cert"
          test -s "$cert"
          trap 'rm -f "$cert"' EXIT
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$tools/zipalign"
          test -x "$tools/apksigner"
          unsigned="native/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$unsigned"
          mkdir -p native/release-candidates
          aligned="$RUNNER_TEMP/kofad-aligned.apk"
          "$tools/zipalign" -f 4 "$unsigned" "$aligned"
          target="native/release-candidates/KOFAD-${KOFAD_NATIVE_CHANNEL}-${KOFAD_NATIVE_VERSION}-android.apk"
          "$tools/apksigner" sign \
            --ks "$cert" \
            --ks-key-alias "$KOFAD_KEY_ALIAS" \
            --ks-pass env:KOFAD_KEYSTORE_PASSWORD \
            --key-pass env:KOFAD_KEY_PASSWORD \
            --out "$target" "$aligned"
          signer="$("$tools/apksigner" verify --print-certs "$target")"
          actual="$(printf '%s\n' "$signer" | grep -m 1 -i 'Signer #1 certificate SHA-256 digest' | sed -E 's/.*digest: //;s/://g' | tr '[:lower:]' '[:upper:]')"
          pinned="$(printf '%s' "$KOFAD_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$actual" || "$actual" != "$pinned" ]]; then
            rm -f "$target"
            echo "::error::APK was not signed by the approved stable KOFAD $KOFAD_NATIVE_CHANNEL certificate"
            exit 1
          fi
          "$tools/apksigner" verify --verbose "$target" >/dev/null
          sha256sum "$target" | tee native/release-candidates/SHA256SUMS.txt
          echo "Signed APK verified against pinned channel-specific publisher certificate."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SIGNED-REVIEW-ONLY-${{ inputs.channel }}-android-${{ inputs.version }}
          path: native/release-candidates/
          retention-days: 7
          if-no-files-found: error
