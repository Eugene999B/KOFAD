name: Build KOFAD Android APK (optional customer publication)
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Separate customer or staff signing identity
        required: true
        type: choice
        options: [customer, staff]
      version:
        description: "SemVer X.Y.Z; must exceed the installed version"
        required: true
        type: string
      version_code:
        description: "Unique increasing Android versionCode"
        required: true
        type: number
      publish_customer:
        description: "Publish verified CUSTOMER APK after device QA and publisher approval"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sign:
    if: github.ref == 'refs/heads/railway-release' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: kofad-native-publishing
    env:
      KOFAD_NATIVE_CHANNEL: ${{ inputs.channel }}
      KOFAD_NATIVE_VERSION: ${{ inputs.version }}
      KOFAD_NATIVE_VERSION_CODE: ${{ inputs.version_code }}
      KOFAD_KEYSTORE_B64: ${{ inputs.channel == 'customer' && secrets.KOFAD_CUSTOMER_ANDROID_KEYSTORE_B64 || secrets.KOFAD_STAFF_ANDROID_KEYSTORE_B64 }}
      KOFAD_KEYSTORE_PASSWORD: ${{ inputs.channel == 'customer' && secrets.KOFAD_CUSTOMER_ANDROID_KEYSTORE_PASSWORD || secrets.KOFAD_STAFF_ANDROID_KEYSTORE_PASSWORD }}
      KOFAD_KEY_ALIAS: ${{ inputs.channel == 'customer' && secrets.KOFAD_CUSTOMER_ANDROID_KEY_ALIAS || secrets.KOFAD_STAFF_ANDROID_KEY_ALIAS }}
      KOFAD_KEY_PASSWORD: ${{ inputs.channel == 'customer' && secrets.KOFAD_CUSTOMER_ANDROID_KEY_PASSWORD || secrets.KOFAD_STAFF_ANDROID_KEY_PASSWORD }}
      KOFAD_CERT_SHA256: ${{ inputs.channel == 'customer' && secrets.KOFAD_CUSTOMER_ANDROID_CERT_SHA256 || secrets.KOFAD_STAFF_ANDROID_CERT_SHA256 }}
    steps:
      - name: Fail closed if publisher keys are missing
        shell: bash
        run: |
          set -euo pipefail
          for key in KOFAD_KEYSTORE_B64 KOFAD_KEYSTORE_PASSWORD KOFAD_KEY_ALIAS KOFAD_KEY_PASSWORD KOFAD_CERT_SHA256; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required protected signing secret: $key"
              exit 1
            fi
          done
          if [[ ! "$KOFAD_CERT_SHA256" =~ ^([[:xdigit:]]{2}:?){32}$ ]]; then
            echo "::error::Pinned Android signing certificate fingerprint is malformed"
            exit 1
          fi
          echo "Publisher signing prerequisites present (no secret values logged)."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Generate correct branded app assets and bundled app
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install Pillow
          python scripts/prepare_logo.py
          python native/scripts/branding.py --channel "$KOFAD_NATIVE_CHANNEL"
          cd native/mobile
          npm install --no-audit --no-fund
          npm test
          node scripts/write-profile.mjs
          npx cap add android
          npx cap sync android
          node scripts/configure-auth-deeplink.mjs android
          npx capacitor-assets generate --android
      - name: Pin release version and compile unsigned artifact
        shell: bash
        run: |
          set -euo pipefail
          python native/scripts/set_android_version.py native/mobile/android/app/build.gradle "$KOFAD_NATIVE_VERSION" "$KOFAD_NATIVE_VERSION_CODE"
          if [[ "$KOFAD_NATIVE_CHANNEL" == "customer" ]]; then
            expected="com.kofadimpex.market"
          else
            expected="com.kofadimpex.staff"
          fi
          if ! grep -qF "applicationId \"$expected\"" native/mobile/android/app/build.gradle; then
            echo "::error::Android native package ID does not match the selected release channel"
            exit 1
          fi
          cd native/mobile/android
          ./gradlew assembleRelease --no-daemon
      - name: Sign and independently verify the Android APK
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cert="$RUNNER_TEMP/kofad-signing.jks"
          printf '%s' "$KOFAD_KEYSTORE_B64" | base64 --decode > "$cert"
          test -s "$cert"
          trap 'rm -f "$cert"' EXIT
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$tools/zipalign"
          test -x "$tools/apksigner"
          unsigned="native/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$unsigned"
          mkdir -p native/release-candidates
          aligned="$RUNNER_TEMP/kofad-aligned.apk"
          "$tools/zipalign" -f 4 "$unsigned" "$aligned"
          target="native/release-candidates/KOFAD-${KOFAD_NATIVE_CHANNEL}-${KOFAD_NATIVE_VERSION}-android.apk"
          "$tools/apksigner" sign \
            --ks "$cert" \
            --ks-key-alias "$KOFAD_KEY_ALIAS" \
            --ks-pass env:KOFAD_KEYSTORE_PASSWORD \
            --key-pass env:KOFAD_KEY_PASSWORD \
            --out "$target" "$aligned"
          signer="$("$tools/apksigner" verify --print-certs "$target")"
          actual="$(printf '%s\n' "$signer" | grep -m 1 -i 'Signer #1 certificate SHA-256 digest' | sed -E 's/.*digest: //;s/://g' | tr '[:lower:]' '[:upper:]')"
          pinned="$(printf '%s' "$KOFAD_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$actual" || "$actual" != "$pinned" ]]; then
            rm -f "$target"
            echo "::error::APK was not signed by the approved stable KOFAD $KOFAD_NATIVE_CHANNEL certificate"
            exit 1
          fi
          "$tools/apksigner" verify --verbose "$target" >/dev/null
          (cd native/release-candidates && sha256sum "$(basename "$target")" > SHA256SUMS.txt)
          cat native/release-candidates/SHA256SUMS.txt
          echo "Signed APK verified against pinned channel-specific publisher certificate."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SIGNED-REVIEW-ONLY-${{ inputs.channel }}-android-${{ inputs.version }}
          path: native/release-candidates/
          retention-days: 7
          if-no-files-found: error

  publish_customer:
    name: Publish independently verified KOFAD Market APK
    needs: sign
    if: github.ref == 'refs/heads/railway-release' && inputs.channel == 'customer' && inputs.publish_customer == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: kofad-native-publishing
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      VERSION_CODE: ${{ inputs.version_code }}
      EXPECTED_SIGNER: ${{ secrets.KOFAD_CUSTOMER_ANDROID_CERT_SHA256 }}
    steps:
      - name: Download only the verified customer release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SIGNED-REVIEW-ONLY-customer-android-${{ inputs.version }}
          path: release-candidate
      - name: Check signature, package identity, version and checksum again
        shell: bash
        run: |
          set -euo pipefail
          version="$VERSION"
          [[ "$version" =~ ^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,3})$ ]] || exit 1
          apk="release-candidate/KOFAD-customer-${version}-android.apk"
          test -s "$apk"
          test -s release-candidate/SHA256SUMS.txt
          test "$(find release-candidate -maxdepth 1 -type f | wc -l)" -eq 2
          (cd release-candidate && sha256sum --check SHA256SUMS.txt)
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$tools/apksigner"
          test -x "$tools/aapt"
          signer="$("$tools/apksigner" verify --print-certs --verbose "$apk")"
          actual="$(printf '%s\n' "$signer" | grep -m 1 -i 'Signer #1 certificate SHA-256 digest' | sed -E 's/.*digest: //;s/://g' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$EXPECTED_SIGNER" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$expected"
          test "$actual" = "$expected"
          badging="$("$tools/aapt" dump badging "$apk")"
          grep -F "name='com.kofadimpex.market'" <<< "$badging" >/dev/null
          grep -F "versionCode='$VERSION_CODE'" <<< "$badging" >/dev/null
          grep -F "versionName='$version'" <<< "$badging" >/dev/null
          echo "The customer package, version, certificate and binary hash are valid."
      - name: Publish an immutable GitHub release for KOFAD Market
        shell: bash
        run: |
          set -euo pipefail
          tag="kofad-market-android-v${VERSION}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Version tag already exists. Never overwrite a signed release."
            exit 1
          fi
          apk="release-candidate/KOFAD-customer-${VERSION}-android.apk"
          gh release create "$tag" \
            "$apk" \
            "release-candidate/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "KOFAD Market Android ${VERSION}" \
            --notes "Official signed KOFAD Market Android release. Package: com.kofadimpex.market. SHA-256SUMS.txt provides the file checksum. Use only approved KOFAD download links. Customer and staff apps are separate." \
            --latest=false
          echo "### Official Android APK" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/KOFAD-customer-${VERSION}-android.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "Approve this exact URL on the KOFAD website only after testing the installed APK." >> "$GITHUB_STEP_SUMMARY"
