name: Prepare unsigned KOFAD Market Android release for offline signing
on:
  pull_request:
    paths:
      - ".github/workflows/android-offline-release.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build local-only KOFAD customer release 1.0.0
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install Pillow
          python scripts/prepare_logo.py
          python native/scripts/branding.py --channel customer
          cd native/mobile
          npm install --no-audit --no-fund
          npm test
          KOFAD_NATIVE_CHANNEL=customer node scripts/write-profile.mjs
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android
          cd ../..
          python native/scripts/set_android_version.py native/mobile/android/app/build.gradle 1.0.0 1
          grep -q 'applicationId "com.kofadimpex.market"' native/mobile/android/app/build.gradle
          cd native/mobile/android
          ./gradlew assembleRelease --no-daemon
      - name: Prepare unsigned zipaligned APK and offline signer tools
        shell: bash
        run: |
          set -euo pipefail
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$tools/zipalign"
          test -s "$tools/lib/apksigner.jar"
          unsigned=native/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$unsigned"
          mkdir -p release-candidate
          "$tools/zipalign" -f 4 "$unsigned" release-candidate/KOFAD-Market-1.0.0-UNSIGNED-aligned.apk
          cp "$tools/lib/apksigner.jar" release-candidate/apksigner.jar
          printf '%s\n' "unsigned release; do not publish before signing and validating certificate" > release-candidate/REVIEW_ONLY.txt
          (cd release-candidate && sha256sum KOFAD-Market-1.0.0-UNSIGNED-aligned.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PRIVATE-OFFLINE-SIGNING-KOFAD-MARKET-1.0.0
          path: release-candidate/
          retention-days: 2
          if-no-files-found: error
