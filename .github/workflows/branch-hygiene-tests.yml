name: Verify KOFAD branch safety
on:
  pull_request:
    paths:
      - scripts/github_branch_cleanup.py
      - tests/test_github_branch_cleanup.py
      - .github/workflows/branch-hygiene.yml
      - .github/workflows/branch-hygiene-tests.yml
      - .github/workflows/promote.yml
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_github_branch_cleanup -v
      - run: python -m py_compile scripts/github_branch_cleanup.py
