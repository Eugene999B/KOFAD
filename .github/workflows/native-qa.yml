name: Verify native KOFAD clients (QA only)
on:
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Every channel is separately generated. Outputs are internal QA binaries,
    # never Play / App Store / public customer download builds.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {channel: customer, platform: android, os: ubuntu-latest}
          - {channel: staff, platform: android, os: ubuntu-latest}
          - {channel: customer, platform: ios, os: macos-latest}
          - {channel: staff, platform: ios, os: macos-latest}
          - {channel: customer, platform: windows, os: windows-latest}
          - {channel: staff, platform: windows, os: windows-latest}
    name: ${{ matrix.channel }} / ${{ matrix.platform }} QA
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      KOFAD_NATIVE_CHANNEL: ${{ matrix.channel }}
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Generate native branding assets
        run: |
          python -m pip install Pillow
          python scripts/prepare_logo.py
          python native/scripts/branding.py --channel ${{ matrix.channel }}
      - name: Install mobile dependencies
        if: matrix.platform != 'windows'
        working-directory: native/mobile
        run: npm install --no-audit --no-fund
      - name: Test native mobile security and package identity
        if: matrix.platform != 'windows'
        working-directory: native/mobile
        run: npm test
      - name: Prepare packaged local client
        if: matrix.platform != 'windows'
        working-directory: native/mobile
        run: node scripts/write-profile.mjs
      - name: Generate Android project and icons
        if: matrix.platform == 'android'
        working-directory: native/mobile
        run: |
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: native/mobile/android/gradle/wrapper/gradle-wrapper.properties
      - name: Compile internal Android debug APK
        if: matrix.platform == 'android'
        working-directory: native/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Generate iOS project and icons
        if: matrix.platform == 'ios'
        working-directory: native/mobile
        run: |
          npx cap add ios
          npx cap sync ios
          npx capacitor-assets generate --ios
      - name: Compile iOS simulator app without distribution signing
        if: matrix.platform == 'ios'
        working-directory: native/mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ../../../build-ios CODE_SIGNING_ALLOWED=NO build
      - name: Install Windows dependencies
        if: matrix.platform == 'windows'
        working-directory: native/desktop
        run: npm install --no-audit --no-fund
      - name: Test Windows client security
        if: matrix.platform == 'windows'
        working-directory: native/desktop
        run: npm test
      - name: Compile unpacked Windows QA client
        if: matrix.platform == 'windows'
        working-directory: native/desktop
        run: npx electron-builder --win dir --x64 --config build.config.cjs --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform == 'android'
        with:
          name: QA-ONLY-${{ matrix.channel }}-android-debug
          path: native/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 4
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform == 'ios'
        with:
          name: QA-ONLY-${{ matrix.channel }}-ios-simulator
          path: native/mobile/build-ios/Build/Products/Debug-iphonesimulator/App.app/
          retention-days: 4
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform == 'windows'
        with:
          name: QA-ONLY-${{ matrix.channel }}-windows-unpacked
          path: native/desktop/dist/${{ matrix.channel }}/win-unpacked/
          retention-days: 4
          if-no-files-found: error
