name: Build native QA previews (not store releases)
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Which isolated app identity?"
        type: choice
        options: [customer, staff]
        required: true
      platform:
        description: "QA build target"
        type: choice
        options: [android, ios, windows]
        required: true

permissions:
  contents: read

jobs:
  qa:
    # QA artifacts only: never publish unsigned binaries to the KOFAD website.
    runs-on: ${{ inputs.platform == 'ios' && 'macos-latest' || inputs.platform == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    env:
      KOFAD_NATIVE_CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - run: python scripts/prepare_logo.py
      - run: python native/scripts/branding.py --channel ${{ inputs.channel }}
      - name: Install mobile tooling
        if: inputs.platform != 'windows'
        working-directory: native/mobile
        run: npm install
      - name: Prepare offline mobile assets
        if: inputs.platform != 'windows'
        working-directory: native/mobile
        run: node scripts/write-profile.mjs
      - name: Prepare Android native project
        if: inputs.platform == 'android'
        working-directory: native/mobile
        run: |
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        if: inputs.platform == 'android'
        with:
          distribution: temurin
          java-version: "21"
      - name: Build internal Android QA APK
        if: inputs.platform == 'android'
        working-directory: native/mobile/android
        run: ./gradlew assembleDebug
      - name: Prepare iOS native project
        if: inputs.platform == 'ios'
        working-directory: native/mobile
        run: |
          npx cap add ios
          npx cap sync ios
          npx capacitor-assets generate --ios
      - name: Verify iOS simulator build without distribution signing
        if: inputs.platform == 'ios'
        working-directory: native/mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Install Windows desktop tooling
        if: inputs.platform == 'windows'
        working-directory: native/desktop
        run: npm install
      - name: Build unpacked Windows QA app
        if: inputs.platform == 'windows'
        working-directory: native/desktop
        run: npx electron-builder --win dir --x64 --config build.config.cjs --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.platform == 'android'
        with:
          name: QA-ONLY-${{ inputs.channel }}-android-debug
          path: native/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.platform == 'windows'
        with:
          name: QA-ONLY-${{ inputs.channel }}-windows-unpacked
          path: native/desktop/dist/${{ inputs.channel }}/win-unpacked/
          retention-days: 5
