name: Verify KOFAD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kofad
          POSTGRES_PASSWORD: testing-only
          POSTGRES_DB: kofad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kofad"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kofad:testing-only@localhost:5432/kofad
      DJANGO_SECRET_KEY: ci-only-nonproduction-key-at-least-32-characters
      DJANGO_DEBUG: "1"
      SECURE_SSL_REDIRECT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt -c requirements.lock
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test --noinput
      - run: pip-audit -r requirements.lock
      - run: playwright install --with-deps chromium
      - run: python manage.py bootstrap_admin --confirm-initial-setup
        env:
          KOFAD_INITIAL_ADMIN_PASSWORD: admin
      - run: python manage.py bootstrap --demo
        env:
          DEMO_PASSWORD: isolated-demo-browser-password
      - run: python manage.py runserver 0.0.0.0:8000 --noreload > /tmp/kofad-server.log 2>&1 &
      - run: python tests/browser_smoke.py
      - name: Verify production container
        run: |
          docker build -t kofad-verify .
          docker run -d --name kofad-verify --network host -e PORT=8080 -e DJANGO_SECRET_KEY -e DATABASE_URL -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 -e DJANGO_DEBUG=0 kofad-verify
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health/; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8080/health/
          curl --fail -H 'X-Forwarded-Proto: https' http://127.0.0.1:8080/login/ > /dev/null
          docker stop kofad-verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
