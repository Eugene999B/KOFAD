name: Bundle sharp KOFAD homepage hero
on:
  push:
    branches:
      - design/phase3-hero-commerce-20261010
    paths:
      - .github/workflows/kofad-hero-photo.yml
permissions:
  contents: write
jobs:
  bundle-homepage-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/phase3-hero-commerce-20261010
          persist-credentials: true
      - name: Download and verify high-resolution Unsplash photograph
        env:
          PHOTO_PAGE: https://unsplash.com/photos/a-well-lit-grocery-store-aisle-with-produce-displays-2vgVRWpwKYE
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from pathlib import Path
          # Direct Unsplash image CDN avoids website anti-scraping/401 restrictions.
          # Unique new scene, not one of the five existing carousel images.
          candidates = [
              "photo-1578916171728-46686eac8d58",
              "photo-1601598851547-4302969d0614",
              "photo-1542838132-92c53300491e",
          ]
          headers = {"User-Agent": "Mozilla/5.0"}
          image = None
          for photo_id in candidates:
              url = (f"https://images.unsplash.com/{photo_id}"
                     "?fm=webp&fit=crop&crop=entropy&w=2200&h=1238&q=88")
              try:
                  with urlopen(Request(url,headers=headers), timeout=45) as response:
                      body = response.read(4_000_000)
                      content_type = response.headers.get("Content-Type","").lower()
                  if body[:4] != b"RIFF" or body[8:12] != b"WEBP" or len(body) < 90_000:
                      raise RuntimeError(f"Wrong image format or too small: {len(body)} bytes; {content_type}")
                  image = body
                  print(f"Downloaded new {photo_id}: {len(body):,} bytes")
                  break
              except Exception as exc:
                  print(f"Candidate {photo_id} failed: {exc}")
          if image is None:
              raise RuntimeError("No verified high-resolution photo downloaded")
          destination = Path("marketplace/static/marketplace/kofad-home-hero-sharp.webp")
          destination.parent.mkdir(parents=True,exist_ok=True)
          destination.write_bytes(image)
          print(f"Bundled {len(image):,} bytes to {destination}")
          PY
      - name: Commit bundled image into the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add marketplace/static/marketplace/kofad-home-hero-sharp.webp
          git diff --cached --quiet && exit 0
          git commit -m "Bundle sharp first KOFAD hero image locally (2200px)"
          git push origin HEAD:design/phase3-hero-commerce-20261010
