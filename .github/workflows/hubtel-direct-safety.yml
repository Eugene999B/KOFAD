name: Hubtel Direct additive integration safety
on:
  pull_request:
    paths:
      - 'hubtel_direct/**'
      - 'config/settings.py'
      - 'config/urls.py'
      - 'docs/HUBTEL_DIRECT_TRANSFERS.md'
      - '.github/workflows/hubtel-direct-safety.yml'
permissions:
  contents: read
jobs:
  hubtel-direct-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kofad
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: kofad
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kofad"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kofad:test-only@localhost:5432/kofad
      DJANGO_SECRET_KEY: test-only-hubtel-direct-integration-secret-1234
      DJANGO_DEBUG: "1"
      SECURE_SSL_REDIRECT: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver,kofadimpex.com,market.kofadimpex.com,staff.kofadimpex.com"
      HUBTEL_DIRECT_RECEIVE_ENABLED: "0"
      HUBTEL_DIRECT_SEND_MOMO_ENABLED: "0"
      HUBTEL_DIRECT_SEND_BANK_ENABLED: "0"
      HUBTEL_DIRECT_EGRESS_CONFIRMED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt -c requirements.lock
      - run: python -m compileall -q hubtel_direct
      - run: ruff check hubtel_direct
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python scripts/prepare_logo.py
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test hubtel_direct marketplace.test_hubtel core.test_pos_hubtel marketplace.test_kofad_ai core.test_telegram_bot --noinput
