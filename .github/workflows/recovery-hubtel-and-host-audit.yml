name: Audit live Hubtel callback and staff-host contracts
on:
  pull_request:
    paths:
      - .github/workflows/recovery-hubtel-and-host-audit.yml
      - core/test_staff_login_routes.py
      - core/test_lost_route_recovery.py
      - core/test_worker_identity.py
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kofad
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: kofad
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kofad"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kofad:test-only@localhost:5432/kofad
      DJANGO_SECRET_KEY: test-only-hubtel-contract-audit-secret-123456
      DJANGO_DEBUG: "1"
      SECURE_SSL_REDIRECT: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt -c requirements.lock
      - run: python scripts/prepare_logo.py
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test marketplace.test_hubtel.HubtelPaymentTests.test_callback_saves_exact_original_json_encrypted_and_allows_download marketplace.test_hubtel.HubtelPaymentTests.test_verified_failed_transaction_stops_retries_and_updates_order marketplace.test_hubtel.HubtelPaymentTests.test_repeated_callbacks_get_separate_evidence_entries core.test_staff_login_routes.StaffLoginRouteRegressionTests core.test_lost_route_recovery.LostRouteOwnerSmokeTests.test_nonexistent_market_category_correctly_returns_404 core.test_worker_identity.WorkerIdentityExperienceTests.test_public_qr_verification_is_safe_and_excludes_private_hr_data --noinput
