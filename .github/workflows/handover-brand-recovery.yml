name: Verify KOFAD customer handover and official branding recovery
on:
  pull_request:
    paths:
      - marketplace/services.py
      - core/workforce_views.py
      - .github/workflows/handover-brand-recovery.yml
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kofad
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: kofad
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kofad"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kofad:test-only@localhost:5432/kofad
      DJANGO_SECRET_KEY: test-only-handover-brand-recovery-secret-1234
      DJANGO_DEBUG: "1"
      SECURE_SSL_REDIRECT: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt -c requirements.lock
      - run: ruff check marketplace/services.py core/workforce_views.py
      - run: python manage.py check
      - run: python scripts/prepare_logo.py
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test marketplace.tests.MarketFulfilmentTests.test_verified_payment_sms_contains_customer_handover_code core.test_branding.BrandingConsistencyTests.test_only_official_logo_asset_is_referenced --noinput
