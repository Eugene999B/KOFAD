name: Verify KOFAD native commerce and push security
on:
  pull_request:
    paths:
      - "marketplace/mobile_cart.py"
      - "marketplace/mobile_private_api.py"
      - "marketplace/mobile_push.py"
      - "marketplace/mobile_push_delivery.py"
      - "marketplace/mobile_push_models.py"
      - "marketplace/mobile_identity.py"
      - "marketplace/mobile_auth_models.py"
      - "marketplace/test_mobile_cart.py"
      - "marketplace/test_mobile_push.py"
      - "marketplace/test_mobile_push_delivery.py"
      - "marketplace/test_mobile_private_api.py"
      - "marketplace/models.py"
      - "marketplace/migrations/**"
      - "core/mobile_staff_api.py"
      - ".github/workflows/native-commerce-push-fast.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-commerce-push-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-commerce-security:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: kofad
          POSTGRES_PASSWORD: testing-only
          POSTGRES_DB: kofad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kofad"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kofad:testing-only@localhost:5432/kofad
      DJANGO_SECRET_KEY: ci-only-nonproduction-key-at-least-32-characters
      DJANGO_DEBUG: "1"
      SECURE_SSL_REDIRECT: "0"
      KOFAD_NATIVE_AUTH_ENABLED: "0"
      KOFAD_NATIVE_CART_ENABLED: "0"
      KOFAD_NATIVE_PUSH_ENABLED: "0"
      KOFAD_NATIVE_PUSH_DELIVERY_ENABLED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt -c requirements.lock
      - name: Validate additive mobile schema without changing live data
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Prove native basket ownership, device revocation and FCM consent
        run: >
          python manage.py test
          marketplace.test_mobile_identity
          marketplace.test_mobile_v1_api
          marketplace.test_mobile_private_api
          marketplace.test_mobile_cart
          marketplace.test_mobile_push
          marketplace.test_mobile_push_delivery
          core.test_mobile_staff_api
          --noinput
