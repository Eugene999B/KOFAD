name: Verify KOFAD mobile release controls
on:
  pull_request:
    paths:
      - "core/mobile_release_models.py"
      - "core/native_apps.py"
      - "core/test_mobile_release_controls.py"
      - "core/test_native_apps.py"
      - "core/migrations/**"
      - ".github/workflows/mobile-release-fast.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-release-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  mobile-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: kofad
          POSTGRES_PASSWORD: testing-only
          POSTGRES_DB: kofad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kofad"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kofad:testing-only@localhost:5432/kofad
      DJANGO_SECRET_KEY: ci-only-nonproduction-key-at-least-32-characters
      DJANGO_DEBUG: "1"
      SECURE_SSL_REDIRECT: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt -c requirements.lock
      - run: python manage.py check
      - run: python manage.py migrate --noinput
      - run: python scripts/prepare_logo.py
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test core.test_mobile_release_controls core.test_native_apps --noinput
