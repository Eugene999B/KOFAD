name: Legacy main-to-production promotion disabled
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-instructions:
    runs-on: ubuntu-latest
    steps:
      - name: Reject unattended or outdated main promotion
        shell: bash
        run: |
          echo 'Automatic main -> railway-release promotion has been intentionally retired.'
          echo 'Do NOT force-push, reset, or use a stale branch to replace production.'
          echo 'Open a reviewed, fully tested pull request against railway-release instead.'
          echo 'Only railway-release is deployed to Railway production.'
