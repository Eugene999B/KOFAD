name: Legacy main-to-production promotion disabled
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-instructions:
    runs-on: ubuntu-latest
    steps:
      - name: Reject unattended promotion
        run: |
          echo 'Automatic main-to-railway-release promotion has been retired.'
          echo 'Never replace Railway production from a stale branch.'
          echo 'Review and test a PR targeted at railway-release instead.'
