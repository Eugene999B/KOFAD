name: Promote verified Railway release
on:
  workflow_run:
    workflows: ["Verify KOFAD"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  issues: write
concurrency:
  group: railway-release-promotion
  cancel-in-progress: false
jobs:
  promote:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Promote only the verified current main commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          if [ "$current" != "$VERIFIED_SHA" ]; then
            echo "Main advanced; waiting for its own successful verification."
            exit 0
          fi
          # GitHub's non-force update cannot advance a diverged branch. Never
          # force-push or replace production content with a stale main tree.
          lineage="$(gh api "repos/$GH_REPO/compare/railway-release...$VERIFIED_SHA" --jq .status)"
          if [ "$lineage" = "identical" ]; then
            echo "Production release already points at this verified commit."
            exit 0
          fi
          if [ "$lineage" != "ahead" ]; then
            title="Release promotion blocked: reconcile main and railway-release"
            echo "::error::Cannot promote safely: main is $lineage relative to railway-release."
            echo "::error::Merge and review histories on a separate branch; NEVER force-push production."
            existing="$(gh issue list --repo "$GH_REPO" --state open --limit 100 --json number,title --jq '.[] | select(.title == "Release promotion blocked: reconcile main and railway-release") | .number' | head -n 1 || true)"
            if [ -z "$existing" ]; then
              gh issue create --repo "$GH_REPO" --title "$title" --body "Automatic release promotion stopped because main and railway-release are not a fast-forward lineage. Do not force-push, reset production, or blindly merge Android feature branches. Review both trees, reconcile through a tested release PR, then restore normal promotion. Last verified main SHA: $VERIFIED_SHA" || true
            fi
            exit 1
          fi
          gh api "repos/$GH_REPO/git/refs/heads/railway-release" \
            --method PATCH --field sha="$VERIFIED_SHA" --field force=false \
            --jq '{ref: .ref, sha: .object.sha}'
