name: Archive and prune verified obsolete KOFAD branches
# Re-run after fixing authenticated Git refs archive lookup.
on:
  pull_request:
    paths:
      - .github/workflows/prune-kofad-obsolete-branches.yml
      - scripts/prune_obsolete_kofad_branches.sh
  push:
    branches: [railway-release]
    paths:
      - .github/workflows/prune-kofad-obsolete-branches.yml
permissions:
  contents: read
jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Dry-run exact-branch deletion preconditions
        env:
          GH_TOKEN: ${{ github.token }}
          PRUNE_DRY_RUN: '1'
        run: bash scripts/prune_obsolete_kofad_branches.sh
  prune-once:
    if: github.event_name == 'push' && github.ref == 'refs/heads/railway-release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Archive frozen SHAs and delete seven proven obsolete refs
        env:
          GH_TOKEN: ${{ github.token }}
          PRUNE_DRY_RUN: '0'
        run: bash scripts/prune_obsolete_kofad_branches.sh
