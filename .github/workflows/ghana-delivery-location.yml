name: Verify Ghana customer delivery location
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kofad
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: kofad
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kofad"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kofad:test-only@localhost:5432/kofad
      DJANGO_SECRET_KEY: nonproduction-ghana-address-regression-testing-secret
      DJANGO_DEBUG: "1"
      SECURE_SSL_REDIRECT: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt -c requirements.lock
      - run: ruff check marketplace/delivery_locations.py marketplace/test_delivery_address_search.py
      - run: node --check marketplace/static/marketplace/delivery-address.js
      - run: python manage.py check
      - run: python scripts/prepare_logo.py
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test marketplace.test_delivery_address_search marketplace.tests.MarketV3CommerceTests.test_delivery_quote_endpoint_and_checkout_has_address_finder --noinput
