name: Verify KOFAD Google weekly backup
on:
  pull_request:
    paths:
      - 'core/google_drive_backup.py'
      - 'core/test_google_drive_backup.py'
      - 'core/urls.py'
      - 'config/settings.py'
      - 'ops/google_drive_weekly_backup.gs'
      - '.github/workflows/google-weekly-backup-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: google-weekly-backup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: kofad
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: kofad
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kofad"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kofad:test-only@localhost:5432/kofad
      DJANGO_SECRET_KEY: test-only-kofad-secret-of-at-least-32-characters
      DJANGO_DEBUG: "1"
      SECURE_SSL_REDIRECT: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt -c requirements.lock
      - name: Verify Google Apps Script syntax
        run: node --check --input-type=commonjs < ops/google_drive_weekly_backup.gs
      - name: Verify Django migration graph
        run: python manage.py migrate --noinput
      - name: Verify opt-in signed export and restorable encryption
        run: python manage.py test core.test_google_drive_backup --noinput
