name: Initialize schema
on: workflow_dispatch
permissions:
  contents: write
jobs:
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kofad
          POSTGRES_PASSWORD: testing-only
          POSTGRES_DB: kofad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kofad"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kofad:testing-only@localhost:5432/kofad
      DJANGO_SECRET_KEY: ci-only-nonproduction-key-at-least-32-characters
      DJANGO_DEBUG: "1"
      SECURE_SSL_REDIRECT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations core
      - run: pip freeze > requirements.lock
      - name: Commit generated schema and dependency lock
        run: |
          git config user.name "KOFAD build"
          git config user.email "kofad-build@users.noreply.github.com"
          git add core/migrations requirements.lock
          git diff --staged --quiet || git commit -m "build: generate initial schema and lock verified dependencies"
          git push
