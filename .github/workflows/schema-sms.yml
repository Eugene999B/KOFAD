name: Generate SMS schema
on: workflow_dispatch
permissions:
  contents: write
jobs:
  schema:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
      DJANGO_SECRET_KEY: ci-only-nonproduction-key-at-least-32-characters
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - run: python manage.py makemigrations core --name sms_and_admin_setup
      - run: |
          git config user.name "KOFAD build"
          git config user.email "kofad-build@users.noreply.github.com"
          git add core/migrations
          git diff --staged --quiet || git commit -m "build: add SMS outbox and initial admin schema"
          git push
