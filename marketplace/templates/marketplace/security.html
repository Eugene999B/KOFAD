{% extends "marketplace/base.html" %}{% block content %}<section class="simple-customer-access"><div class="simple-access-card"><div class="access-card-mark">K</div><h1>Change password</h1><p>Update the password for your customer account.</p><form method="post">{% csrf_token %}{{ form.non_field_errors }}<label>Current password{{ form.current_password }}{{ form.current_password.errors }}</label><label>New password{{ form.password }}{{ form.password.errors }}</label><label>Confirm new password{{ form.password_confirm }}{{ form.password_confirm.errors }}</label><button class="market-button primary wide">Save password <span>→</span></button></form><a class="simple-access-back" href="/market/account/">← Back to account</a></div></section>{% endblock %}
