{% extends "marketplace/base.html" %}{% block content %}
<section class="simple-customer-access">
<div class="simple-access-card">
<div class="access-card-mark">K</div>
<h1>Reset password</h1>
<p>Enter your mobile number and KOFAD will send a verification code.</p>
<form method="post">{% csrf_token %}
<label>Mobile number<input name="phone" value="{{ phone }}" inputmode="tel" autocomplete="tel" placeholder="024 123 4567" required></label>
<button class="market-button primary wide">Send code <span>→</span></button>
</form>
<a class="simple-access-back" href="/market/account/login/">← Back to sign in</a>
</div>
</section>{% endblock %}
