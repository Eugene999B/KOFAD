{% extends "marketplace/base.html" %}{% block content %}
<section class="simple-customer-access premium-market-access">
<div class="simple-access-card premium-access-card">
{% include "marketplace/_auth_logo.html" %}
<h1>Reset password</h1>
<p>Enter your mobile number.</p>
{% include "marketplace/_auth_messages.html" %}
<form method="post" class="premium-auth-form">{% csrf_token %}
<label>Mobile number<input name="phone" value="{{ phone }}" inputmode="tel" autocomplete="tel" placeholder="024 123 4567" required autofocus></label>
<button class="market-button primary wide" type="submit">Continue <span>→</span></button>
</form>
{% include "marketplace/_support_contacts.html" %}
<a class="simple-access-back" href="/market/account/login/">Back to sign in</a>
</div>
</section>{% endblock %}
