{% extends "marketplace/base.html" %}{% block content %}
<section class="simple-customer-access premium-market-access">
<div class="simple-access-card premium-access-card">
{% include "marketplace/_auth_logo.html" %}
<h1>Choose a new password</h1>
<p>Your number has been verified.</p>
{% include "marketplace/_auth_messages.html" %}
<form method="post" class="premium-auth-form">{% csrf_token %}{{ form.non_field_errors }}
<label>New password{{ form.password }}{{ form.password.errors }}</label>
<label>Confirm new password{{ form.password_confirm }}{{ form.password_confirm.errors }}</label>
<button class="market-button primary wide" type="submit">Change password <span>→</span></button>
</form>
</div>
</section>{% endblock %}
