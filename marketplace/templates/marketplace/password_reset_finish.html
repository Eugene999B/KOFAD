{% extends "marketplace/base.html" %}{% block content %}
<section class="simple-customer-access">
<div class="simple-access-card">
<div class="access-card-mark">K</div>
<h1>Choose a new password</h1>
<p>Your number <strong>{{ phone }}</strong> has been verified.</p>
<form method="post">{% csrf_token %}{{ form.non_field_errors }}
<label>New password{{ form.password }}{{ form.password.errors }}</label>
<label>Confirm new password{{ form.password_confirm }}{{ form.password_confirm.errors }}</label>
<button class="market-button primary wide">Change password <span>→</span></button>
</form>
</div>
</section>{% endblock %}
