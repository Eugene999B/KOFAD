{% extends "marketplace/base.html" %}{% block content %}
<section class="simple-customer-access premium-market-access">
<div class="simple-access-card premium-access-card">
{% include "marketplace/_auth_logo.html" %}
<h1>Verify your number</h1>
<p>Enter the six-digit code sent to <strong>{{ phone }}</strong>.</p>
{% include "marketplace/_auth_messages.html" %}
<form method="post" class="premium-auth-form">{% csrf_token %}
<label>Six-digit code<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required placeholder="000000" autofocus></label>
<button class="market-button primary wide" type="submit">Verify <span>→</span></button>
</form>
<form method="post" class="resend-form">{% csrf_token %}<input type="hidden" name="action" value="resend"><button type="submit">Send another code</button></form>
</div>
</section>{% endblock %}
