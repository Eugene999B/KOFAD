{% extends "marketplace/base.html" %}{% block content %}<section class="account-shell compact"><div class="account-story"><p class="market-eyebrow">SECURITY CHECK</p><h1>Verify before<br><span>changing anything.</span></h1><p>Enter the six-digit SMS code sent to <strong>{{ phone }}</strong>. The code expires in five minutes.</p></div><div class="account-card"><span class="account-step">VERIFY NUMBER</span><h2>Enter the reset code.</h2><form method="post">{% csrf_token %}<label>Six-digit code<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required placeholder="000000"></label><button class="market-button primary wide">Verify code <span>→</span></button></form><form method="post" class="resend-form">{% csrf_token %}<input type="hidden" name="action" value="resend"><button>Send another code</button></form></div></section>{% endblock %}
