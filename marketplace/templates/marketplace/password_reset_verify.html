{% extends "marketplace/base.html" %}{% block content %}
<section class="simple-customer-access">
<div class="simple-access-card">
<div class="access-card-mark">K</div>
<h1>Verify your number</h1>
<p>Enter the six-digit code sent to <strong>{{ phone }}</strong>. It expires in five minutes.</p>
<form method="post">{% csrf_token %}
<label>Six-digit code<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required placeholder="000000"></label>
<button class="market-button primary wide">Verify <span>→</span></button>
</form>
<form method="post" class="resend-form">{% csrf_token %}<input type="hidden" name="action" value="resend"><button>Send another code</button></form>
</div>
</section>{% endblock %}
