{% extends "marketplace/base.html" %}{% load static %}{% block content %}
<section class="market-entry">
  <div class="market-entry-copy">
    <div class="market-entry-kicker"><span></span>KOFAD MARKET</div>
    <h1>Everything you need,<br><em>ready to explore.</em></h1>
    <p>Sign in to explore live retail and wholesale products.</p>
    <div class="market-entry-actions">
      <a class="market-entry-primary" href="/market/access/?next=/market/">Sign in to explore <span>→</span></a>
      <a class="market-entry-back" href="/">Back to KOPEX</a>
    </div>
  </div>
  <div class="market-entry-visual" aria-hidden="true">
    <div class="market-entry-glow"></div>
    <div class="market-entry-stack">
      {% for listing in gateway_listings %}
      <figure class="market-entry-tile tile-{{ forloop.counter }}">
        {% if listing.image_thumb %}
          <img src="/market/products/{{ listing.pk }}/image/thumb/" alt="" loading="{% if forloop.first %}eager{% else %}lazy{% endif %}">
        {% elif listing.image_url %}
          <img src="{{ listing.image_url }}" alt="" loading="{% if forloop.first %}eager{% else %}lazy{% endif %}" referrerpolicy="no-referrer">
        {% else %}
          <div class="market-entry-placeholder"><img src="{% static 'brand/kofad-emblem.png' %}" alt=""></div>
        {% endif %}
      </figure>
      {% empty %}
      <figure class="market-entry-tile tile-1"><div class="market-entry-placeholder"><img src="{% static 'brand/kofad-emblem.png' %}" alt=""></div></figure>
      <figure class="market-entry-tile tile-2"><div class="market-entry-placeholder"><img src="{% static 'brand/kofad-emblem.png' %}" alt=""></div></figure>
      <figure class="market-entry-tile tile-3"><div class="market-entry-placeholder"><img src="{% static 'brand/kofad-emblem.png' %}" alt=""></div></figure>
      {% endfor %}
    </div>
    <div class="market-entry-seal"><img src="{% static 'brand/kofad-emblem.png' %}" alt=""></div>
  </div>
</section>
{% endblock %}
