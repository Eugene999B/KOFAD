{% extends "marketplace/base.html" %}{% block content %}
<section class="simple-customer-access">
<div class="simple-access-card">
<div class="access-card-mark">K</div>
<h1>Sign in or create account</h1>
<p>Enter your mobile number to continue.</p>
<form method="post" class="access-phone-form">{% csrf_token %}{{ form.non_field_errors }}
<label>Mobile number{{ form.phone }}{{ form.phone.errors }}</label>
<button class="market-button primary wide">Continue <span>→</span></button>
</form>
<a class="simple-access-back" href="/market/">← Back to Market</a>
</div>
</section>{% endblock %}
