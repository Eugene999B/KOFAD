{% extends "marketplace/base.html" %}{% block content %}<section class="account-shell compact"><div class="account-story"><p class="market-eyebrow">VERIFIED · {{ phone }}</p><h1>Finish your account.</h1><p>Your password protects your orders, messages and saved delivery details.</p></div><div class="account-card"><span class="account-step">STEP 3 OF 3</span><h2>Create your customer profile.</h2><form method="post">{% csrf_token %}<label>Full name{{ form.full_name }}{{ form.full_name.errors }}</label><label>Email address <small>Required before Paystack payment. You can add it now or at checkout.</small>{{ form.email }}{{ form.email.errors }}</label><label>Create password{{ form.password }}{{ form.password.errors }}</label><label>Confirm password{{ form.password_confirm }}{{ form.password_confirm.errors }}</label><button class="market-button primary wide">Create account <span>→</span></button></form></div></section>{% endblock %}
