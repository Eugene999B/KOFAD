{% extends "marketplace/base.html" %}{% block content %}
<section class="simple-customer-access">
<div class="simple-access-card">
<div class="access-card-mark">K</div>
<h1>Create account</h1>
<p><strong>{{ phone }}</strong> is verified. Add your name and choose your password.</p>
<form method="post">{% csrf_token %}{{ form.non_field_errors }}
<label>Full name{{ form.full_name }}{{ form.full_name.errors }}</label>
<label>Password{{ form.password }}{{ form.password.errors }}</label>
<label>Confirm password{{ form.password_confirm }}{{ form.password_confirm.errors }}</label>
<button class="market-button primary wide">Create account <span>→</span></button>
</form>
</div>
</section>{% endblock %}
