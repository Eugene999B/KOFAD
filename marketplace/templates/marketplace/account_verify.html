{% extends "marketplace/base.html" %}{% block content %}<section class="account-shell compact"><div class="account-story"><p class="market-eyebrow">PHONE VERIFICATION</p><h1>Check your messages.</h1><p>We sent a six-digit KOFAD verification code to <strong>{{ phone }}</strong>. It expires in five minutes.</p></div><div class="account-card"><span class="account-step">STEP 2 OF 3</span><h2>Enter the SMS code.</h2><form method="post">{% csrf_token %}<label>Six-digit code<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required></label><button class="market-button primary wide">Verify number <span>→</span></button></form><form method="post" class="resend-form">{% csrf_token %}<input type="hidden" name="action" value="resend"><button>Send another code</button></form></div></section>{% endblock %}
