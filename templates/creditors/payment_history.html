<div class="section-heading"><h3>Recent payments</h3><a class="text-link" href="/parties/{{ selected.party.pk }}/statement/">Full ledger →</a></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Reference</th><th class="number">Amount</th><th></th></tr></thead><tbody>{% for payment in selected.recent_payments %}<tr><td>{{ payment.created_at|date:"j M Y H:i" }}</td><td>{{ payment.reference }}</td><td class="number">{{ payment.total|floatformat:2 }}</td><td><a href="/documents/{{ payment.pk }}/">Open</a></td></tr>{% empty %}<tr><td colspan="4" class="empty">No payments recorded yet.</td></tr>{% endfor %}</tbody></table></div>
