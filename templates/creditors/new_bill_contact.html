<div class="form-grid three"><label>Existing creditor<select name="party"><option value="">Create new creditor below</option>{% for supplier in suppliers %}<option value="{{ supplier.pk }}" {% if selected and selected.party.pk == supplier.pk %}selected{% endif %}>{{ supplier.name }} · {{ supplier.phone }}</option>{% endfor %}</select></label><label>New creditor name<input name="supplier_name" maxlength="120"></label><label>New creditor phone<input name="supplier_phone" maxlength="40"></label><label>New creditor email<input type="email" name="supplier_email"></label><label class="span-2">New creditor address<input name="supplier_address"></label></div>
