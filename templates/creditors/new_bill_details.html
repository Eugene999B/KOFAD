<div class="form-grid three"><label>Bill date<input type="date" name="document_date" value="{{ today|date:'Y-m-d' }}" required></label><label>Due date<input type="date" name="due_date" required></label><label>Supplier invoice / reference<input name="external_reference" maxlength="120" placeholder="Duplicate checked"></label><label>Category<select name="category">{% for value,label in categories %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></label><label>Amount · {{ company.currency }}<input type="number" name="amount" min=".01" step=".01" required></label><label class="span-2">What do we owe for?<textarea name="note" required minlength="5"></textarea></label></div>
