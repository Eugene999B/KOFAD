<section id="record-creditor-payment" class="creditor-payment-box"><div class="section-heading"><div><p class="eyebrow">RECORD PAYMENT</p><h3>Pay this creditor</h3></div><span class="muted">Oldest due first</span></div>{% if selected.outstanding > 0 %}<form method="post">{% csrf_token %}<input type="hidden" name="key" value="{{ key }}"><input type="hidden" name="action" value="payment"><input type="hidden" name="party" value="{{ selected.party.pk }}"><div class="form-grid three"><label>Apply to<select name="invoice"><option value="">Whole account</option>{% for row in selected.bill_rows %}<option value="{{ row.bill.pk }}" {% if selected_invoice == row.bill.pk|stringformat:"s" %}selected{% endif %}>{{ row.bill.external_reference|default:row.bill.reference }} · {{ row.outstanding|floatformat:2 }}</option>{% endfor %}</select></label><label>Amount · {{ company.currency }}<input type="number" name="amount" min=".01" step=".01"></label><label>Channel<select name="method">{% for value,label in methods %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></label><label>Bank / MoMo reference<input name="reference" maxlength="100"></label><label class="span-2">Note<input name="note" maxlength="500"></label></div><div class="form-actions"><label class="check-row"><input type="checkbox" name="pay_full"> Pay selected balance in full</label><button class="button">Record payment</button></div></form>{% else %}<div class="notice success">This creditor account is fully settled.</div>{% endif %}</section>
