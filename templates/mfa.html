{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify access · KOFAD</title><link rel="stylesheet" href="{% static 'app.css' %}"></head><body class="mfa-page"><main class="panel narrow"><img src="{% static 'brand/kofad-mark.svg' %}" width="48" height="48" alt="KOFAD"><h1>Verify your access.</h1>{% if not enrolled %}<p>Add this key to your authenticator app as a time-based account named KOFAD. Keep the key private.</p><code class="secret">{{ secret }}</code>{% endif %}{% if error %}<p class="notice error">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label for="code">Six-digit authenticator code</label><input name="code" id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus><button class="button">Verify</button></form></main></body></html>
