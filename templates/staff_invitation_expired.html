{% load static %}<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Activate your KOFAD staff account</title>
<link rel="stylesheet" href="{% static 'app.css' %}">
<link rel="stylesheet" href="{% static 'kofad-contrast-mobile.css' %}">
<style>
body{min-height:100svh;display:grid;place-items:center;padding:24px;margin:0;background:#eff5f8;color:#0e2c40;font:16px/1.5 system-ui,sans-serif}
.invite-card{width:min(100%,460px);box-sizing:border-box;padding:clamp(22px,5vw,38px);border:1px solid #ccdce4;border-radius:23px;background:#fff;box-shadow:0 16px 48px #1033481c}
.invite-card img{width:82px;max-height:80px;object-fit:contain}
.invite-card h1{font-size:clamp(24px,6vw,32px);line-height:1.17;color:#0e2c40}
.invite-card p{color:#476476}
.invite-card label{display:block;margin-top:15px;font-weight:650}
.invite-card input{width:100%;box-sizing:border-box;padding:13px 15px;min-height:49px;border:1px solid #9cb7c5;border-radius:12px;font:inherit}
.invite-card button{width:100%;min-height:50px;margin:20px 0 0;background:#0e3b56;color:#fff;border:0;border-radius:12px;font-weight:750;cursor:pointer}
.invite-card a{color:#075d72}
</style></head><body><main class="invite-card">
<img src="{% static 'brand/kofad-official-logo.svg' %}" alt="KOFAD IMPEX ENTERPRISE">
<h1>Invitation unavailable</h1><p>This private link has expired, was already used, or is invalid. Ask your KOFAD administrator to renew your invitation.</p>
</main></body></html>
