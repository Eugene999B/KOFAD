{% extends "base.html" %}{% block content %}<section class="panel form-panel"><p class="muted">{{ description }}</p><form method="post">{% csrf_token %}{{ form.non_field_errors }}<div class="form-grid">{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>{{ field }}{{ field.errors }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}</div>{% endfor %}</div><div class="form-actions"><button class="button">Save changes</button><a href="/" class="text-link">Back to workspace</a></div></form></section>{% endblock %}
