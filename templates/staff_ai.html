{% extends "base.html" %}
{% load static %}
{% block body_class %}staff-ai-page{% endblock %}
{% block head %}
<link rel="stylesheet" href="{% static 'staff-ai.css' %}">
<script defer src="{% static 'staff-ai.js' %}"></script>
{% endblock %}
{% block content %}
<section class="staff-ai-workspace" data-staff-ai-endpoint="{% url 'staff_ai_chat' %}" aria-label="KOFAD Assistant chat">
  <header class="staff-ai-header">
    <div class="staff-ai-identity">
      <span class="staff-ai-mark" aria-hidden="true">✳</span>
      <div><h2>KOFAD Assistant</h2><p><span class="staff-ai-status-dot" aria-hidden="true"></span> Your private workspace</p></div>
    </div>
    <button type="button" class="staff-ai-tool" id="staff-ai-reset" aria-label="Start new chat" title="New chat">
      <span aria-hidden="true">＋</span> <span class="staff-ai-new-label">New chat</span>
    </button>
  </header>
  <div class="staff-ai-conversation">
    <div class="staff-ai-log" id="staff-ai-log" role="log" aria-live="polite" aria-relevant="additions" aria-label="Conversation">
      <div class="staff-ai-landing" id="staff-ai-landing" aria-hidden="true">
        <div class="staff-ai-landing-mark">✳</div>
        <p>How can I help?</p>
      </div>
    </div>
    <form id="staff-ai-form" class="staff-ai-form">
      {% csrf_token %}
      <label class="sr-only" for="staff-ai-question">Message KOFAD Assistant</label>
      <div class="staff-ai-compose">
        <textarea id="staff-ai-question" rows="1" minlength="2" maxlength="600" placeholder="Ask anything about your work..." aria-label="Message KOFAD Assistant" required></textarea>
        <button id="staff-ai-submit" type="submit" aria-label="Send message" title="Send message"><span aria-hidden="true">↑</span></button>
      </div>
      <p class="sr-only" id="staff-ai-status" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
{% endblock %}
